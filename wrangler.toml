# Cloudflare Pages: the static site (out/, from `next build`) and its Functions (functions/).
# DEPLOY.md: how to create the project and the database. database_id is filled in then; local
# development (wrangler pages dev) uses a local SQLite file under .wrangler/ and ignores it.
name = "pyoor"
pages_build_output_dir = "out"
compatibility_date = "2025-04-01"

[[d1_databases]]
binding = "DB"
database_name = "pyoor"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
